name: First Operation
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: action/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        uses: npm ci
      - name: Run tests
        uses: npm test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - uses: action/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        uses: npm ci
      - name: Build Project
        uses: npm run build
      - name: Deploy
        uses: echo "Deploying..."
