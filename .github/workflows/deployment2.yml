name: First Operation
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint Test
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying..."

