name: First Operation
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Caching
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint Test
        run: npm run lint
      - name: Run tests
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.scripted }}
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Caching
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Publish JS filename
        id: publish
        run: |
          FILE=$(ls src/test/*.js | head -n 1)
          echo "scripted=$FILE" >>  $GITHUB_OUTPUT ';'
      - name: Saving artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-files
          path: package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact-files
      - name: Output contents
        run: ls
      - name: Output filename
        run: echo "${{ needs.build.output.script-file }}"
      - name: Deploy
        run: echo "${{ github.repository }}"


